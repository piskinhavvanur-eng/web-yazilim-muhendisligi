<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ders 9 - Site ve Harita Gömmek (İframe)</title>
    </head>
    <body>
        <h1>Site ve Harita Gömmek (İframe)</h1>

        <h2>YouTube Videosu Gömme</h2>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/Sw2vsLpJeTQ?si=5ovdUYQYAheqNzek"
            title="YouTube video player"
            frameborder="0"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>

        <h2>Google Haritası Gömme</h2>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2998.1552084207933!2d31.417583553689603!3d41.28372641834053!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x409c44b99b86c77d%3A0xe38c03bee22fb734!2sKdz.%20Ere%C4%9Fli%20Belediyesi%20Kent%20M%C3%BCzesi!5e0!3m2!1str!2str!4v1793126481809!5m2!1str!2str"
            width="800"
            height="300"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
    </body>
</html>
