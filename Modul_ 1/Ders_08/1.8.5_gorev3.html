<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geliştiriciler için HTML çapa (anchor) sisteminin kod örnekleri ve detayları.">
    <link rel="icon" href="./images/gorev3-favicon.png">
    <title>Teknik Blog | Anchor Sistemi</title>
</head>

<body>
    <!-- Sayfa başına inmek için Ana Başlığa ID veriyoruz -->
    <h1 id="sayfa-basi">Sayfa İçi Çapa (Anchor) Sistemi</h1>
    <p>HTML'de sayfa içi geçişler yapmak için <code>
        href="#id"mantığı kullanılır.
    </code></p>
    <br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br>
    <!-- Kod ÖRNEĞİ  -->
    <h2>Kod Örneği</h2>
    <pre>
        <code>
&lt;a href="#sayfa-basi"&gt;Yukarı Çık&lt;/a&gt;
        </code>
    </pre>
    <br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br>
    <!-- Sayfanın en altındaki asansör butonu -->
    <a href="#sayfa-basi">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd"
                d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm.53 5.47a.75.75 0 0 0-1.06 0l-3 3a.75.75 0 1 0 1.06 1.06l1.72-1.72v5.69a.75.75 0 0 0 1.5 0v-5.69l1.72 1.72a.75.75 0 1 0 1.06-1.06l-3-3Z"
                clip-rule="evenodd" />
        </svg>
        Yukarı Çık
    </a>
</body>

</html>
